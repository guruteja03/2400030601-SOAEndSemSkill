
spring.application.name=API-GATEWAY
server.port=8080

spring.main.web-application-type=servlet

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.jersey.enabled=false

spring.cloud.gateway.server.webmvc.routes[0].id=driver-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://DRIVER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/drivers/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1
